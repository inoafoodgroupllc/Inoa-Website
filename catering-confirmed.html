<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>catering order confirmed — inoa</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:opsz,wght@9..40,300;9..40,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink:       #1a1a1a;
      --cream:     #f5f0e8;
      --sand:      #e8e0d0;
      --driftwood: #8b7355;
      --ogo:       #4a7c6f;
    }
    html, body { height: 100%; background: var(--cream); color: var(--ink); font-family: 'DM Sans', sans-serif; }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 40px;
    }
    .nav-logo { height: 28px; }
    .nav-back { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); opacity: 0.5; text-decoration: none; transition: opacity 0.2s; }
    .nav-back:hover { opacity: 1; }

    .page {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 120px 24px 80px;
    }

    .card { max-width: 540px; width: 100%; text-align: center; }

    .checkmark {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--ogo);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 32px;
    }
    .checkmark svg { width: 26px; height: 26px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

    .heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(36px, 6vw, 52px);
      font-weight: 300; letter-spacing: -0.02em; line-height: 1.1;
      margin-bottom: 16px;
    }
    .sub {
      font-size: 14px; line-height: 1.75; opacity: 0.6;
      max-width: 400px; margin: 0 auto 40px;
    }
    .divider { width: 40px; height: 1px; background: rgba(26,26,26,0.18); margin: 0 auto 40px; }

    .detail-block {
      background: rgba(26,26,26,0.04);
      border: 1px solid rgba(26,26,26,0.08);
      border-radius: 4px; padding: 24px 28px; margin-bottom: 16px; text-align: left;
    }
    .detail-label { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.38; margin-bottom: 6px; }
    .detail-value { font-size: 14px; opacity: 0.85; line-height: 1.55; }

    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 32px; }
    .btn-home {
      display: inline-block; padding: 12px 28px;
      background: var(--ink); color: var(--cream);
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      text-decoration: none; border-radius: 2px;
      transition: opacity 0.2s;
    }
    .btn-home:hover { opacity: 0.8; }
    .btn-catering {
      display: inline-block; padding: 12px 28px;
      background: transparent; color: var(--ink);
      border: 1px solid rgba(26,26,26,0.22);
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      text-decoration: none; border-radius: 2px;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-catering:hover { background: var(--sand); border-color: var(--sand); }

    .notice { margin-top: 32px; font-size: 11px; opacity: 0.38; line-height: 1.7; }
  </style>
</head>
<body>

  <nav>
    <a href="/home"><img src="/brand_assets/inoa_logo_transparent%20(1).png" alt="inoa" class="nav-logo"></a>
    <a href="/home" class="nav-back">← back to home</a>
  </nav>

  <main class="page">
    <div class="card">

      <div class="checkmark">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>

      <h1 class="heading">you're all set.</h1>
      <p class="sub" id="conf-sub">Payment received. We'll send a confirmation email shortly.</p>

      <div class="divider"></div>

      <div class="detail-block" id="conf-date-block" style="display:none">
        <div class="detail-label">event date</div>
        <div class="detail-value" id="conf-date"></div>
      </div>

      <div class="detail-block" id="conf-email-block" style="display:none">
        <div class="detail-label">confirmation sent to</div>
        <div class="detail-value" id="conf-email"></div>
      </div>

      <div class="detail-block" id="conf-ref-block" style="display:none">
        <div class="detail-label">reference</div>
        <div class="detail-value" id="conf-ref" style="font-size:12px;font-family:monospace;opacity:0.6"></div>
      </div>

      <div class="actions">
        <a href="/home" class="btn-home">back to home</a>
        <a href="/catering" class="btn-catering">place another order</a>
      </div>

      <p class="notice">Questions? Text us at (925) 391-6589</p>
    </div>
  </main>

  <script>
    function show(id) { const el = document.getElementById(id); if (el) el.style.display = 'block'; }
    function setText(id, text) { const el = document.getElementById(id); if (el) el.textContent = text; }

    function formatDate(dateStr) {
      try {
        return new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US', {
          weekday: 'long', month: 'long', day: 'numeric', year: 'numeric',
        });
      } catch { return dateStr; }
    }

    // Primary: sessionStorage set by catering.html before redirect
    const ref   = sessionStorage.getItem('inoa_catering_reference');
    const email = sessionStorage.getItem('inoa_catering_email');
    const date  = sessionStorage.getItem('inoa_catering_date');

    if (ref || email || date) {
      sessionStorage.removeItem('inoa_catering_reference');
      sessionStorage.removeItem('inoa_catering_email');
      sessionStorage.removeItem('inoa_catering_date');
    }

    // Fallback: Square appends ?referenceId=... to redirect URL
    const params    = new URLSearchParams(window.location.search);
    const refParam  = params.get('referenceId');

    const finalRef   = ref   || refParam || '';
    const finalEmail = email || '';
    const finalDate  = date  || '';

    if (finalDate) {
      setText('conf-date', formatDate(finalDate));
      show('conf-date-block');
    }
    if (finalEmail) {
      setText('conf-email', finalEmail);
      show('conf-email-block');
      setText('conf-sub', `Payment received. We'll send a confirmation to ${finalEmail} shortly.`);
    }
    if (finalRef) {
      setText('conf-ref', finalRef);
      show('conf-ref-block');
    }
  </script>

</body>
</html>
