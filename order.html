<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pre-order — inoa</title>

  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <meta property="og:title" content="pre-order — inoa">
  <meta property="og:description" content="Place a pre-order for fresh poke and sushi from inoa in Scotts Valley, CA.">
  <meta property="og:image" content="https://inoa.kitchen/og-image.png">
  <meta property="og:url" content="https://inoa.kitchen/order">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://inoa.kitchen/og-image.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">

  <style>
    /* ── Reset & Variables ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    :root {
      --ink:       #1a1a1a;
      --cream:     #f5f0e8;
      --sand:      #e8e0d0;
      --driftwood: #8b7355;
      --ogo:       #4a7c6f;
      --white:     #ffffff;
      --err:       #b87a5a;
    }
    body {
      background: var(--cream);
      color: var(--ink);
      font-family: 'DM Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── Grain ── */
    .grain {
      position: fixed; inset: -50%; width: 200%; height: 200%;
      opacity: 0.025; pointer-events: none; z-index: 9999;
    }

    /* ── Page intro ── */
    .page-intro {
      position: fixed; inset: 0; background: var(--ink);
      z-index: 500; pointer-events: none;
      animation: curtain-lift 1.1s cubic-bezier(0.76,0,0.24,1) 0.1s both;
    }
    @keyframes curtain-lift {
      0%   { clip-path: inset(0 0 0% 0); }
      100% { clip-path: inset(0 0 100% 0); }
    }

    /* ── Nav ── */
    .order-nav {
      position: fixed; inset: 0 0 auto 0; z-index: 300;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 40px;
      background: rgba(245,240,232,0.92);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 1px 0 rgba(26,26,26,0.07);
    }
    .order-nav-logo { height: 26px; width: auto; display: block; }
    .order-nav-back {
      font-size: 10px; font-weight: 400; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--ink); opacity: 0.45; text-decoration: none;
      transition: opacity 0.2s;
    }
    .order-nav-back:hover { opacity: 0.9; }

    /* ── Legal footer ── */
    .legal-footer { background: var(--ink); border-top: 1px solid rgba(245,240,232,0.05); padding: 18px 80px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
    .legal-footer-links { display: flex; gap: 28px; flex-wrap: wrap; }
    .legal-footer-links a { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cream); text-decoration: none; opacity: 0.28; transition: opacity 0.2s; }
    .legal-footer-links a:hover { opacity: 0.6; }
    .legal-footer-copy { font-size: 10px; letter-spacing: 0.08em; color: var(--cream); opacity: 0.16; white-space: nowrap; }

    /* ── Menu page ── */
    .menu-page { padding: 80px 0 140px; min-height: 100vh; }
    .menu-inner { max-width: 920px; margin: 0 auto; padding: 40px 40px 0; }
    .menu-heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(38px, 5vw, 60px); font-weight: 300;
      letter-spacing: -0.02em; line-height: 1.05;
      color: var(--ink); margin-bottom: 6px;
    }
    .menu-sub {
      font-size: 11px; color: var(--ink); opacity: 0.4;
      letter-spacing: 0.06em; margin-bottom: 44px;
    }

    /* ── Category ── */
    .cat-section { margin-bottom: 44px; }
    .cat-hdr { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .cat-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px; font-weight: 400; letter-spacing: 0.02em;
      color: var(--ink); white-space: nowrap;
    }
    .cat-rule { flex: 1; height: 1px; background: rgba(26,26,26,0.1); }
    .cat-desc { font-size: 11px; color: var(--ink); opacity: 0.36; margin-top: -8px; margin-bottom: 14px; font-style: italic; }

    /* ── Item grid ── */
    .item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

    /* ── Item card ── */
    .item-card {
      background: var(--white); border: 1px solid rgba(26,26,26,0.07);
      border-radius: 4px; padding: 16px;
      display: flex; flex-direction: column;
      transition: border-color 0.15s, box-shadow 0.15s;
      position: relative;
    }
    .item-card.modal-item { cursor: pointer; }
    .item-card.modal-item:hover { border-color: rgba(26,26,26,0.18); box-shadow: 0 2px 10px rgba(26,26,26,0.07); }
    .item-card.has-qty { border-color: var(--driftwood); background: rgba(139,115,85,0.025); }
    .item-card-badge {
      position: absolute; top: 12px; right: 12px;
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--driftwood); color: var(--white);
      font-size: 10px; font-weight: 500;
      display: flex; align-items: center; justify-content: center;
    }
    .item-card-name { font-size: 13px; font-weight: 500; color: var(--ink); margin-bottom: 3px; padding-right: 24px; }
    .item-card-tag {
      display: inline-block; font-size: 8px; letter-spacing: 0.06em;
      background: rgba(74,124,111,0.1); color: var(--ogo);
      border-radius: 2px; padding: 1px 5px; margin-left: 5px; vertical-align: middle;
    }
    .item-card-desc { font-size: 11px; color: var(--ink); opacity: 0.4; line-height: 1.55; flex: 1; margin-bottom: 14px; }
    .item-card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
    .item-card-price { font-size: 13px; color: var(--ink); opacity: 0.68; }

    /* Add button (for modal items — whole card is clickable) */
    .item-card-icon {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--ink); color: var(--white);
      border: none; font-size: 17px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: opacity 0.15s; flex-shrink: 0;
      pointer-events: none;
    }

    /* Inline qty stepper (for no-modifier items) */
    .item-qty-ctrl { display: flex; align-items: center; gap: 8px; }
    .iqc-btn {
      width: 26px; height: 26px; border-radius: 50%;
      border: 1px solid rgba(26,26,26,0.18); background: transparent;
      font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.12s; color: var(--ink);
    }
    .iqc-btn:hover:not(:disabled) { background: var(--ink); color: var(--white); border-color: var(--ink); }
    .iqc-btn:active:not(:disabled) { transform: scale(0.92); }
    .iqc-btn:disabled { opacity: 0.2; cursor: default; }
    .iqc-val { font-size: 13px; color: var(--ink); min-width: 14px; text-align: center; }

    /* ── Item modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.48);
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      z-index: 400;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .modal-panel {
      background: var(--white); width: 100%; max-width: 560px;
      max-height: 92vh; display: flex; flex-direction: column;
      border-radius: 14px 14px 0 0;
      animation: modal-up 0.3s cubic-bezier(0.32, 0.72, 0, 1) both;
    }
    @keyframes modal-up {
      from { transform: translateY(48px); opacity: 0; }
      to   { transform: translateY(0);   opacity: 1; }
    }
    .modal-handle { width: 36px; height: 4px; background: rgba(26,26,26,0.12); border-radius: 2px; margin: 14px auto 0; flex-shrink: 0; }
    .modal-scroll { overflow-y: auto; flex: 1; padding: 20px 24px 8px; -webkit-overflow-scrolling: touch; }
    .modal-close {
      position: absolute; top: 14px; right: 16px;
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(26,26,26,0.07); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: var(--ink); opacity: 0.55;
      transition: opacity 0.15s;
    }
    .modal-close:hover { opacity: 1; }
    .modal-item-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px; font-weight: 400; letter-spacing: -0.01em;
      color: var(--ink); margin-bottom: 3px; padding-right: 36px; line-height: 1.15;
    }
    .modal-item-price { font-size: 14px; color: var(--ink); opacity: 0.62; margin-bottom: 6px; }
    .modal-item-desc { font-size: 12px; color: var(--ink); opacity: 0.4; line-height: 1.6; margin-bottom: 20px; }
    .modal-qty-row {
      display: flex; align-items: center; justify-content: center; gap: 18px;
      padding: 16px 0; margin-bottom: 20px;
      border-top: 1px solid rgba(26,26,26,0.06);
      border-bottom: 1px solid rgba(26,26,26,0.06);
    }
    .mqr-btn {
      width: 34px; height: 34px; border-radius: 50%;
      border: 1.5px solid rgba(26,26,26,0.18); background: transparent;
      font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.12s; color: var(--ink);
    }
    .mqr-btn:hover:not(:disabled) { background: var(--ink); color: var(--white); border-color: var(--ink); }
    .mqr-btn:disabled { opacity: 0.22; cursor: default; }
    .mqr-val { font-size: 18px; color: var(--ink); min-width: 30px; text-align: center; }

    /* Modifier groups */
    .mod-group { margin-bottom: 22px; }
    .mod-group-hdr {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .mod-group-label {
      font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--ink); opacity: 0.5;
    }
    .mod-badge {
      font-size: 10px; padding: 2px 9px; border-radius: 10px;
      letter-spacing: 0.04em;
    }
    .mod-badge.req  { background: rgba(26,26,26,0.07); color: var(--ink); opacity: 0.55; }
    .mod-badge.done { background: rgba(74,124,111,0.14); color: var(--ogo); opacity: 1; }
    .mod-badge.opt  { background: rgba(26,26,26,0.05); color: var(--ink); opacity: 0.38; }
    .mod-rule { height: 1px; background: rgba(26,26,26,0.07); margin-bottom: 10px; }

    /* Option rows (flavors, sides, fish) */
    .mod-opt-list { display: flex; flex-direction: column; gap: 2px; }
    .mod-opt {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 12px; border-radius: 3px; cursor: pointer;
      transition: background 0.1s; border: 1px solid transparent;
    }
    .mod-opt:hover { background: rgba(26,26,26,0.03); }
    .mod-opt.sel { background: rgba(139,115,85,0.07); border-color: rgba(139,115,85,0.2); }
    .mod-indicator {
      width: 16px; height: 16px; border-radius: 50%;
      border: 1.5px solid rgba(26,26,26,0.2);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.12s;
    }
    .mod-indicator.sq { border-radius: 3px; }
    .mod-opt.sel .mod-indicator { background: var(--driftwood); border-color: var(--driftwood); }
    .mod-indicator-dot { width: 6px; height: 6px; background: var(--white); border-radius: 50%; opacity: 0; transition: opacity 0.12s; }
    .mod-opt.sel .mod-indicator-dot { opacity: 1; }
    .mod-opt-name { font-size: 13px; color: var(--ink); flex: 1; }
    .mod-opt-price { font-size: 12px; color: var(--ink); opacity: 0.42; }

    /* Add-ons grid */
    .addon-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .addon-card {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 11px; border: 1px solid rgba(26,26,26,0.09);
      border-radius: 3px; cursor: pointer; transition: all 0.12s;
    }
    .addon-card:hover { border-color: rgba(26,26,26,0.2); }
    .addon-card.sel { border-color: var(--driftwood); background: rgba(139,115,85,0.05); }
    .addon-cb {
      width: 15px; height: 15px; border: 1.5px solid rgba(26,26,26,0.2);
      border-radius: 3px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.12s;
    }
    .addon-card.sel .addon-cb { background: var(--driftwood); border-color: var(--driftwood); }
    .addon-cb-check { font-size: 9px; color: var(--white); opacity: 0; transition: opacity 0.12s; line-height: 1; }
    .addon-card.sel .addon-cb-check { opacity: 1; }
    .addon-name { font-size: 12px; color: var(--ink); flex: 1; line-height: 1.3; }
    .addon-price { font-size: 11px; color: var(--ink); opacity: 0.42; flex-shrink: 0; }

    /* Modal sticky bottom */
    .modal-bottom {
      flex-shrink: 0;
      border-top: 1px solid rgba(26,26,26,0.08);
      padding: 14px 24px;
      padding-bottom: calc(14px + env(safe-area-inset-bottom));
      background: var(--white);
    }
    .modal-add-btn {
      width: 100%; background: var(--ink); color: var(--cream);
      border: none; padding: 14px 20px;
      font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
      cursor: pointer; border-radius: 3px;
      display: flex; align-items: center; justify-content: space-between;
      transition: opacity 0.15s;
    }
    .modal-add-btn:not(:disabled):hover { opacity: 0.82; }
    .modal-add-btn:disabled { opacity: 0.28; cursor: not-allowed; }

    /* ── Cart bar ── */
    .cart-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      background: var(--white); border-top: 1px solid rgba(26,26,26,0.1);
      padding: 12px 40px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      box-shadow: 0 -4px 28px rgba(26,26,26,0.09);
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .cart-bar.visible { transform: translateY(0); }
    .cart-bar-info { display: flex; flex-direction: column; gap: 1px; }
    .cart-bar-count { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); opacity: 0.42; }
    .cart-bar-total { font-size: 20px; color: var(--ink); letter-spacing: -0.01em; }
    .cart-bar-btn {
      background: var(--ink); color: var(--cream); border: none;
      padding: 13px 32px;
      font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
      cursor: pointer; border-radius: 3px; transition: opacity 0.15s; white-space: nowrap;
    }
    .cart-bar-btn:hover { opacity: 0.82; }

    /* ── Checkout view ── */
    .checkout-page { padding: 80px 0 80px; min-height: 100vh; }
    .checkout-inner { max-width: 620px; margin: 0 auto; padding: 40px 40px 0; }
    .checkout-heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(36px, 5vw, 56px); font-weight: 300;
      letter-spacing: -0.02em; color: var(--ink); margin-bottom: 6px;
    }
    .checkout-sub { font-size: 11px; color: var(--ink); opacity: 0.38; letter-spacing: 0.06em; margin-bottom: 40px; }
    .co-section { margin-bottom: 36px; }
    .co-section-title {
      font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--driftwood); opacity: 0.65; margin-bottom: 16px;
      display: flex; align-items: center; gap: 12px;
    }
    .co-section-title::after { content: ''; flex: 1; height: 1px; background: rgba(26,26,26,0.08); }

    /* Cart review */
    .cri {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 11px 0; border-bottom: 1px solid rgba(26,26,26,0.06);
    }
    .cri:last-child { border-bottom: none; }
    .cri-qty { font-size: 12px; color: var(--ink); opacity: 0.35; flex-shrink: 0; min-width: 18px; padding-top: 1px; }
    .cri-body { flex: 1; min-width: 0; }
    .cri-name { font-size: 13px; color: var(--ink); }
    .cri-mods { font-size: 11px; color: var(--ink); opacity: 0.4; margin-top: 2px; line-height: 1.5; }
    .cri-acts { display: flex; gap: 10px; margin-top: 4px; }
    .cri-edit { font-size: 10px; letter-spacing: 0.06em; color: var(--driftwood); background: none; border: none; cursor: pointer; padding: 0; opacity: 0.75; }
    .cri-edit:hover { opacity: 1; }
    .cri-del { font-size: 10px; letter-spacing: 0.06em; color: var(--ink); background: none; border: none; cursor: pointer; padding: 0; opacity: 0.28; }
    .cri-del:hover { opacity: 0.55; }
    .cri-price { font-size: 13px; color: var(--ink); opacity: 0.65; flex-shrink: 0; padding-top: 1px; }
    /* Inline qty for simple items in review */
    .cri-qty-ctrl { display: flex; align-items: center; gap: 7px; margin-top: 5px; }
    .cqc-btn { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(26,26,26,0.16); background: transparent; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.12s; color: var(--ink); }
    .cqc-btn:hover { background: var(--ink); color: var(--white); border-color: var(--ink); }
    .cqc-val { font-size: 12px; color: var(--ink); min-width: 14px; text-align: center; }

    /* Form fields */
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
    .form-label { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); opacity: 0.5; }
    .form-input, .form-textarea {
      font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink);
      background: var(--white); border: 1px solid rgba(26,26,26,0.12); border-radius: 2px;
      padding: 11px 13px; outline: none; transition: border-color 0.2s;
      -webkit-appearance: none; width: 100%; box-sizing: border-box;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--ink); }
    .form-input.err { border-color: var(--err); }
    .form-err { font-size: 11px; color: var(--err); }
    .form-hint { font-size: 11px; color: var(--ink); opacity: 0.38; line-height: 1.6; }
    .form-textarea { resize: vertical; min-height: 80px; line-height: 1.6; }

    /* Date / slot */
    .date-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .date-btn {
      padding: 8px 12px; border: 1px solid rgba(26,26,26,0.12); border-radius: 2px;
      font-family: 'DM Sans', sans-serif; font-size: 11px; color: var(--ink);
      background: var(--white); cursor: pointer; transition: all 0.14s;
      display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 48px;
    }
    .date-btn:hover { border-color: rgba(26,26,26,0.28); }
    .date-btn.on { background: var(--ink); border-color: var(--ink); color: var(--cream); }
    .date-day { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.55; }
    .date-btn.on .date-day { opacity: 0.65; }
    .date-num { font-size: 15px; }
    .slot-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-bottom: 20px; }
    .slot-col { display: flex; flex-direction: column; gap: 3px; }
    .slot-hour { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); opacity: 0.42; margin-bottom: 4px; text-align: center; }
    .slot-btn {
      background: rgba(26,26,26,0.04); border: 1px solid rgba(26,26,26,0.09);
      border-radius: 2px; padding: 5px 2px;
      font-family: 'DM Sans', sans-serif; font-size: 11px; color: var(--ink);
      cursor: pointer; transition: background 0.1s, border-color 0.1s; text-align: center;
    }
    .slot-btn:hover:not(.booked) { background: rgba(26,26,26,0.09); border-color: rgba(26,26,26,0.22); }
    .slot-btn.on { background: var(--ink); color: var(--cream); border-color: var(--ink); }
    .slot-btn.booked { opacity: 0.2; cursor: not-allowed; pointer-events: none; text-decoration: line-through; }
    .slot-hint { font-size: 12px; color: var(--ink); opacity: 0.42; padding: 8px 0 16px; }
    .slot-full { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--err); padding: 10px 0 16px; }
    .slot-conflict { font-size: 12px; color: var(--err); margin-bottom: 10px; }

    /* Promo */
    .promo-row { display: flex; gap: 8px; margin-bottom: 4px; }
    .promo-row .form-input { flex: 1; text-transform: uppercase; letter-spacing: 0.06em; }
    .promo-apply {
      padding: 0 15px; border: 1px solid rgba(26,26,26,0.18); border-radius: 2px;
      font-family: 'DM Sans', sans-serif; font-size: 10px; letter-spacing: 0.12em;
      text-transform: uppercase; background: transparent; color: var(--ink);
      cursor: pointer; white-space: nowrap; transition: all 0.15s;
    }
    .promo-apply:hover { background: var(--ink); color: var(--cream); border-color: var(--ink); }

    // ── Time slots (48 × 5-min, 12:00–4:00 PM) ───────────────────────────────
    const TIME_SLOTS = (() => {
      const fmt = (h, m) => `${h > 12 ? h - 12 : h}:${String(m).padStart(2,'0')} ${h >= 12 ? 'PM' : 'AM'}`;
      const out = [];
      for (let min = 0; min < 240; min += 5) {
        const h = 12 + Math.floor(min / 60), m = min % 60;
        const eh = 12 + Math.floor((min + 5) / 60), em = (min + 5) % 60;
        out.push({ label:`${fmt(h,m)} – ${fmt(eh,em)}`, key:`${String(h).padStart(2,'0')}${String(m).padStart(2,'0')}` });
      }
      return out;
    })();

    // ── Helpers ───────────────────────────────────────────────────────────────
    function uid() { return Math.random().toString(36).slice(2, 10); }

    function modValid(mods, cfg) {
      if (!cfg) return true;
      if (cfg.flavors && (mods.flavors||[]).length < cfg.flavors.min) return false;
      if (cfg.sides   && (mods.sides||[]).length   < cfg.sides.min)   return false;
      if (cfg.fish    && !mods.fish)                                   return false;
      return true;
    }

    function modSummary(mods) {
      const parts = [];
      if (mods.flavors?.length) parts.push(mods.flavors.join(' + '));
      if (mods.sides?.length)   parts.push(mods.sides.join(', '));
      if (mods.fish)            parts.push(mods.fish);
      if (mods.addOns?.length)  parts.push(mods.addOns.map(a => a.name).join(', '));
      return parts.join(' · ');
    }

    function unitPrice(basePrice, mods) {
      return basePrice + (mods.addOns||[]).reduce((s,a) => s + a.price, 0);

      return n % 1 === 0 ? `$${n}` : `$${n.toFixed(2)}`;
    }

      const d = v.replace(/\D/g,'').slice(0,10);
      if (d.length <= 3) return d;
      if (d.length <= 6) return `(${d.slice(0,3)}) ${d.slice(3)}`;
      return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
    }

    function fmtDate(key) {
      return new Date(key + 'T12:00:00').toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });

    function scrollTop() { window.scrollTo({ top:0, behavior:'smooth' }); }

    // ── Form open / window logic ──────────────────────────────────────────────
    function isFormOpen() {
      return true; // TEST OVERRIDE — remove before shipping
      const now = new Date();
      const key = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      if (key === '2026-07-02') return true;
      if (key === '2026-07-18') return true;
      if (key < '2026-08-05') return false;
      const d = now.getDay();
      return d === 0 || d === 3;
    }

    function getNextOpening() {
      const now = new Date();
      const key = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      if (key < '2026-08-05') return new Date('2026-08-05T00:00:00');
      const day  = now.getDay();
      const toSun = (7 - day) % 7 || 7;
      const toWed = (3 - day + 7) % 7 || 7;
      const next = new Date(now);
      next.setDate(now.getDate() + Math.min(toSun, toWed));
      next.setHours(0,0,0,0);
      return next;
    }

    function getWindowDates() {
      const DAYS = ['sun','mon','tue','wed','thu','fri','sat'];
      const now  = new Date();
      const todayKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      if (todayKey === '2026-07-02') return [{ key:'2026-07-03', day:'fri', num:3,  month:7, dayOfWeek:5 }];
      if (todayKey === '2026-07-18') return [{ key:'2026-07-19', day:'sun', num:19, month:7, dayOfWeek:0 }];
      const today = now.getDay();
      let daysBack = 0;
      for (let i = 0; i <= 6; i++) {
        const d = (today - i + 7) % 7;
        if (d === 0 || d === 3) { daysBack = i; break; }
      }
      const anchor = new Date(now);
      anchor.setDate(now.getDate() - daysBack);
      const anchorKey = `${anchor.getFullYear()}-${String(anchor.getMonth()+1).padStart(2,'0')}-${String(anchor.getDate()).padStart(2,'0')}`;
      if (anchorKey === '2026-07-22') return [1,2].map(off => { const d=new Date(anchor); d.setDate(anchor.getDate()+off); return { key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, day:DAYS[d.getDay()], num:d.getDate(), month:d.getMonth()+1, dayOfWeek:d.getDay() }; });
      const openDay = anchor.getDay();
      const offsets = openDay === 0 ? [1,2] : [1,2,3];
      return offsets.map(off => {
        const d = new Date(anchor);
        d.setDate(anchor.getDate() + off);
        return { key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, day:DAYS[d.getDay()], num:d.getDate(), month:d.getMonth()+1, dayOfWeek:d.getDay() };
      });
    }

    // ── Slot availability hook ────────────────────────────────────────────────
    function useBookedSlots(date) {
      const [booked,  setBooked]  = useState(new Set());
      const [loading, setLoading] = useState(false);
      useEffect(() => {
        if (!date || !db) { setBooked(new Set()); return; }
        setLoading(true);
        const unsub = db.collection('slots').where('date','==',date).onSnapshot(
          snap => {
            const now = Date.now();
            const keys = new Set();
            snap.docs.forEach(d => {
              const data = d.data();
              if (data.status === 'paid') {
                keys.add(data.slotKey);
              } else if (data.status === 'reserved') {
                const ts = data.reservedAt?.toDate?.()?.getTime?.() || 0;
                if (now - ts < SLOT_HOLD_MS) keys.add(data.slotKey);
              } else {
                keys.add(data.slotKey); // legacy
              }
            });
            setBooked(keys); setLoading(false);
          },
          err => { console.error('[inoa] slots error:', err); setLoading(false); }
        );
        return () => unsub();
      }, [date]);
      return { booked, loading };
    }

      const next  = getNextOpening();
      const diff  = Math.max(0, next - new Date());
      const days  = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      const mins  = Math.floor((diff % 3600000)  / 60000);
      const secs  = Math.floor((diff % 60000)    / 1000);
      const units = [{ v:days, l:'days' },{ v:hours, l:'hrs' },{ v:mins, l:'min' },{ v:secs, l:'sec' }];
      const nextLabel = next.toLocaleDateString('en-US',{ weekday:'long', month:'long', day:'numeric' }).toLowerCase();
      return (
        <div className="po-closed">
          <div className="po-closed-label">O &nbsp;R &nbsp;D &nbsp;E &nbsp;R &nbsp;S</div>

          <div className="po-countdown">

              </div>

          </div>
          <p className="po-closed-next">next opening — {nextLabel}</p>
        </div>
      );
    }

    // ── ItemModal ─────────────────────────────────────────────────────────────
    function ItemModal({ item, editLine, onAdd, onClose }) {
      const cfg = MODIFIER_CONFIGS[item.id] || {};
      const [qty, setQty] = useState(editLine?.quantity || 1);
      const [mods, setMods] = useState(editLine ? { ...editLine.modifiers } : { flavors:[], sides:[], fish:null, addOns:[] });

      const up = unitPrice(item.price, mods);
      const total = up * qty;
      const valid = modValid(mods, cfg);
      const isEdit = !!editLine;

      function toggleFlavor(name) {
        setMods(prev => {
          const cur = prev.flavors || [];
          const max = cfg.flavors?.max || 1;
          if (cur.includes(name)) return { ...prev, flavors: cur.filter(f => f !== name) };
          if (cur.length >= max) {
            return max === 1 ? { ...prev, flavors:[name] } : prev;
          }
          return { ...prev, flavors:[...cur, name] };
        });
      }
      function toggleSide(name) {
        setMods(prev => {
          const cur = prev.sides || [];
          const max = cfg.sides?.max || 2;
          if (cur.includes(name)) return { ...prev, sides: cur.filter(s => s !== name) };
          if (cur.length >= max) return prev;
          return { ...prev, sides:[...cur, name] };
        });
      }
      function setFish(name) {
        setMods(prev => ({ ...prev, fish: prev.fish === name ? null : name }));
      }
      function toggleAddon(addon) {
        setMods(prev => {
          const cur = prev.addOns || [];
          const exists = cur.find(a => a.name === addon.name);
          if (exists) return { ...prev, addOns: cur.filter(a => a.name !== addon.name) };
          return { ...prev, addOns:[...cur, addon] };
        });
      }

      function handleAdd() {
        if (!valid) return;
        onAdd({
          cartId:    editLine?.cartId || uid(),
          itemId:    item.id,
          name:      item.name,
          basePrice: item.price,
          modifiers: mods,
          quantity:  qty,
          unitPrice: up,
        }, isEdit);
        onClose();
      }

      function FlavorCount() {
        const n = (mods.flavors||[]).length, max = cfg.flavors?.max, min = cfg.flavors?.min;
        const done = n >= min;
        const label = max === 1 ? (done ? '✓ selected' : '1 required') : (done ? `✓ ${n}/${max}` : `choose ${min}–${max}`);
        return <span className={`mod-badge ${done ? 'done' : 'req'}`}>{label}</span>;
      }
      function SideCount() {
        const n = (mods.sides||[]).length, max = cfg.sides?.max, min = cfg.sides?.min;
        const done = n >= min;
        const label = done ? `✓ ${n}/${max}` : `choose ${min}–${max}`;
        return <span className={`mod-badge ${done ? 'done' : 'req'}`}>{label}</span>;
      }

      return (
        <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
          <div className="modal-panel" style={{position:'relative'}}>
            <div className="modal-handle" />
            <button className="modal-close" onClick={onClose} aria-label="close">✕</button>
            <div className="modal-scroll">
              <div className="modal-item-name">{item.name}</div>
              <div className="modal-item-price">{fmtMoney(item.price)}</div>
              {item.desc && <div className="modal-item-desc">{item.desc}</div>}

              <div className="modal-qty-row">
                <button className="mqr-btn" onClick={() => setQty(q => Math.max(1, q-1))} disabled={qty<=1}>−</button>
                <span className="mqr-val">{qty}</span>
                <button className="mqr-btn" onClick={() => setQty(q => q+1)}>+</button>
              </div>

              {/* Flavors */}
              {cfg.flavors && (
                <div className="mod-group">
                  <div className="mod-group-hdr">
                    <span className="mod-group-label">choose flavor</span>
                    <FlavorCount />
                  </div>
                  <div className="mod-rule" />
                  <div className="mod-opt-list">
                    {FLAVOR_OPTS.map(name => {
                      const sel = (mods.flavors||[]).includes(name);
                      const isRadio = cfg.flavors.max === 1;
                      return (
                        <div key={name} className={`mod-opt${sel?' sel':''}`} onClick={() => toggleFlavor(name)}>
                          <div className={`mod-indicator${isRadio?'':' sq'}`}>
                            <div className="mod-indicator-dot" />
                          </div>
                          <span className="mod-opt-name">{name}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* Sides */}
              {cfg.sides && (
                <div className="mod-group">
                  <div className="mod-group-hdr">
                    <span className="mod-group-label">choose sides</span>
                    <SideCount />
                  </div>
                  <div className="mod-rule" />
                  <div className="mod-opt-list">
                    {SIDE_OPTS.map(name => {
                      const sel = (mods.sides||[]).includes(name);
                      return (
                        <div key={name} className={`mod-opt${sel?' sel':''}`} onClick={() => toggleSide(name)}>
                          <div className="mod-indicator sq"><div className="mod-indicator-dot" /></div>
                          <span className="mod-opt-name">{name}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* Fish */}
              {cfg.fish && (
                <div className="mod-group">
                  <div className="mod-group-hdr">
                    <span className="mod-group-label">choose fish</span>
                    <span className={`mod-badge ${mods.fish ? 'done' : 'req'}`}>{mods.fish ? '✓ selected' : '1 required'}</span>
                  </div>
                  <div className="mod-rule" />
                  <div className="mod-opt-list">
                    {FISH_OPTS.map(name => {
                      const sel = mods.fish === name;
                      return (
                        <div key={name} className={`mod-opt${sel?' sel':''}`} onClick={() => setFish(name)}>
                          <div className="mod-indicator"><div className="mod-indicator-dot" /></div>
                          <span className="mod-opt-name">{name}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* Add-ons */}
              {cfg.addOns && (
                <div className="mod-group">
                  <div className="mod-group-hdr">
                    <span className="mod-group-label">add-ons</span>
                    <span className="mod-badge opt">optional</span>
                  </div>
                  <div className="mod-rule" />
                  <div className="addon-grid">
                    {ADDON_OPTS.map(addon => {
                      const sel = !!(mods.addOns||[]).find(a => a.name === addon.name);
                      return (
                        <div key={addon.name} className={`addon-card${sel?' sel':''}`} onClick={() => toggleAddon(addon)}>
                          <div className="addon-cb"><span className="addon-cb-check">✓</span></div>
                          <div style={{flex:1,minWidth:0}}>
                            <div className="addon-name">{addon.name}</div>
                            <div className="addon-price">+{fmtMoney(addon.price)}</div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>

            <div className="modal-bottom">
              <button className="modal-add-btn" onClick={handleAdd} disabled={!valid}>
                <span>{isEdit ? 'save changes' : 'add to cart'}</span>
                <span>{fmtMoney(total)}</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ── ItemCard ──────────────────────────────────────────────────────────────
    function ItemCard({ item, cartQty, onAdd, onRemove, onModalOpen }) {
      const needsModal = hasModal(item.id);

      if (needsModal) {
        return (
          <div className={`item-card modal-item${cartQty > 0 ? ' has-qty' : ''}`} onClick={() => onModalOpen(item)}>
            {cartQty > 0 && <span className="item-card-badge">{cartQty}</span>}
            <div className="item-card-name">
              {item.name}
              {item.tag && <span className="item-card-tag">{item.tag}</span>}
            </div>
            {item.desc && <div className="item-card-desc">{item.desc}</div>}
            <div className="item-card-footer">
              <span className="item-card-price">{fmtMoney(item.price)}</span>
              <span className="item-card-icon">+</span>
            </div>
          </div>
        );
      }

      return (
        <div className={`item-card${cartQty > 0 ? ' has-qty' : ''}`}>
          <div className="item-card-name">
            {item.name}
            {item.tag && <span className="item-card-tag">{item.tag}</span>}
          </div>
          {item.desc && <div className="item-card-desc">{item.desc}</div>}
          <div className="item-card-footer">
            <span className="item-card-price">{fmtMoney(item.price)}</span>
            {cartQty === 0 ? (
              <button className="item-card-icon" onClick={() => onAdd(item)} style={{pointerEvents:'all'}}>+</button>
            ) : (
              <div className="item-qty-ctrl" onClick={e => e.stopPropagation()}>
                <button className="iqc-btn" onClick={() => onRemove(item)}>−</button>
                <span className="iqc-val">{cartQty}</span>
                <button className="iqc-btn" onClick={() => onAdd(item)}>+</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ── MenuView ──────────────────────────────────────────────────────────────
    function MenuView({ cartItems, onAddSimple, onRemoveSimple, onModalOpen }) {
      const simpleQty = (itemId) => {
        return cartItems.filter(ci => ci.itemId === itemId && !hasModal(itemId))
          .reduce((s, ci) => s + ci.quantity, 0);
      };
      const modalCount = (itemId) => cartItems.filter(ci => ci.itemId === itemId).length;

      return (
        <div className="menu-page">
          <div className="menu-inner">
            <h1 className="menu-heading">pre-order</h1>
            <p className="menu-sub">pickup only · 100 Enterprise Way, Scotts Valley, CA 95066</p>

            {CATEGORIES.map(cat => {
              const items = ITEMS.filter(it => it.cat === cat);
              if (!items.length) return null;
              return (
                <div key={cat} className="cat-section">
                  <div className="cat-hdr">
                    <span className="cat-name">{cat}</span>
                    <div className="cat-rule" />
                  </div>
                  {CAT_DESC[cat] && <p className="cat-desc">{CAT_DESC[cat]}</p>}
                  <div className="item-grid">
                    {items.map(item => (
                      <ItemCard
                        key={item.id}
                        item={item}
                        cartQty={hasModal(item.id) ? modalCount(item.id) : simpleQty(item.id)}
                        onAdd={onAddSimple}
                        onRemove={onRemoveSimple}
                        onModalOpen={onModalOpen}
                      />
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ── CartBar ───────────────────────────────────────────────────────────────
    function CartBar({ cartItems, onCheckout }) {
      const total = cartItems.reduce((s, ci) => s + ci.unitPrice * ci.quantity, 0);
      const count = cartItems.reduce((s, ci) => s + ci.quantity, 0);
      const visible = cartItems.length > 0;
      return (
        <div className={`cart-bar${visible ? ' visible' : ''}`}>
          <div className="cart-bar-info">
            <span className="cart-bar-count">{count} {count === 1 ? 'item' : 'items'}</span>
            <span className="cart-bar-total">{fmtMoney(total)}</span>
          </div>
          <button className="cart-bar-btn" onClick={onCheckout}>checkout →</button>
        </div>
      );
    }

    // ── CheckoutView ──────────────────────────────────────────────────────────
    function CheckoutView({ cartItems, onEditItem, onRemoveItem, onQtyChange, details, setDetails, onBack, onSubmit, slotConflict, onClearSlotConflict, submitting, pickupDates }) {
      const [smsConsent, setSmsConsent] = useState(false);
      const [smsErr,     setSmsErr]     = useState(false);
      const [errors,     setErrors]     = useState({});
      const [promoInput, setPromoInput] = useState(details.promoCode || '');
      const [promoStatus,setPromoStatus]= useState(details.promoCode ? 'ok' : null);

      const { booked: bookedSlots, loading: slotsLoading } = useBookedSlots(details.date);
      const allBooked = !!details.date && !slotsLoading && TIME_SLOTS.every(s => bookedSlots.has(s.key));

      const subtotal      = cartItems.reduce((s, ci) => s + ci.unitPrice * ci.quantity, 0);
      const ucscDiscount  = details.ucscStudent   ? Math.round(subtotal * 0.10 * 100) / 100 : 0;
      const promoDiscount = details.promoDiscount ? Math.round(subtotal * details.promoDiscount * 100) / 100 : 0;
      const finalTotal    = subtotal - ucscDiscount - promoDiscount;

      function set(f, v) { setDetails(p => ({ ...p, [f]:v })); setErrors(p => ({ ...p, [f]:false })); }

      function applyPromo() {
        const code  = promoInput.trim().toLowerCase();
        const promo = PROMO_CODES[code];
        if (promo) {
          setDetails(p => ({ ...p, promoCode:code, promoDiscount:promo.discount||0, promoFreeMusubi:!!promo.freeMusubi }));
          setPromoStatus('ok');
        } else {
          setDetails(p => ({ ...p, promoCode:'', promoDiscount:0, promoFreeMusubi:false }));
          setPromoStatus(null);
        }
      }

      function validate() {
        const e = {};
        if (!details.firstName?.trim()) e.firstName = 'required';
        if (!details.lastName?.trim())  e.lastName  = 'required';
        if (!details.phone?.trim() || details.phone.replace(/\D/g,'').length < 10) e.phone = 'valid phone required';
        if (!details.email?.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(details.email)) e.email = 'valid email required';
        if (!details.date) e.date = 'select a date';
        if (!details.time) e.time = 'select a time';
        setErrors(e);
        return Object.keys(e).length === 0;
      }

      function handlePay() {
        if (!smsConsent) { setSmsErr(true); return; }
        if (!validate()) { scrollTop(); return; }
        onSubmit();
      }

      return (
        <div className="checkout-page">
          <div className="checkout-inner">
            <h2 className="checkout-heading">checkout</h2>
            <p className="checkout-sub">pickup only · inoa · scotts valley</p>

            {/* Cart review */}
            <div className="co-section">
              <div className="co-section-title">your order</div>
              {cartItems.map(ci => {
                const needsModal = hasModal(ci.itemId);
                const sum = modSummary(ci.modifiers || {});
                return (
                  <div key={ci.cartId} className="cri">
                    <span className="cri-qty">×{ci.quantity}</span>
                    <div className="cri-body">
                      <div className="cri-name">{ci.name}</div>
                      {sum && <div className="cri-mods">{sum}</div>}
                      <div className="cri-acts">
                        {needsModal
                          ? <button className="cri-edit" onClick={() => onEditItem(ci)}>edit</button>
                          : (
                            <div className="cri-qty-ctrl">
                              <button className="cqc-btn" onClick={() => onQtyChange(ci.cartId, ci.quantity - 1)}>−</button>
                              <span className="cqc-val">{ci.quantity}</span>
                              <button className="cqc-btn" onClick={() => onQtyChange(ci.cartId, ci.quantity + 1)}>+</button>
                            </div>
                          )
                        }
                        <button className="cri-del" onClick={() => onRemoveItem(ci.cartId)}>remove</button>
                      </div>
                    </div>
                    <span className="cri-price">{fmtMoney(ci.unitPrice * ci.quantity)}</span>
                  </div>
                );
              })}
              {details.promoFreeMusubi && (
                <div className="cri">
                  <span className="cri-qty">×1</span>
                  <div className="cri-body"><div className="cri-name">Spam Musubi</div><div className="cri-mods">TANIKA promo — complimentary</div></div>
                  <span className="cri-price" style={{color:'var(--ogo)'}}>free</span>
                </div>
              )}
            </div>

            {/* Pickup date */}
            <div className="co-section">
              <div className="co-section-title">
                pickup date
                {errors.date && <span style={{color:'var(--err)',fontSize:'10px',letterSpacing:0,textTransform:'none',marginLeft:'6px'}}>{errors.date}</span>}
              </div>
              <div className="date-grid">
                {pickupDates.map(d => (
                  <button key={d.key} className={`date-btn${details.date===d.key?' on':''}`} onClick={() => { set('date',d.key); set('time',''); }}>
                    <span className="date-day">{d.day}</span>
                    <span className="date-num">{d.num}</span>
                  </button>
                ))}
              </div>
            </div>

            {/* Pickup time */}
            <div className="co-section">
              <div className="co-section-title">
                pickup time
                {errors.time && <span style={{color:'var(--err)',fontSize:'10px',letterSpacing:0,textTransform:'none',marginLeft:'6px'}}>{errors.time}</span>}
              </div>
              {slotConflict && <p className="slot-conflict">That slot was just taken — please choose another time.</p>}
              {!details.date ? (
                <p className="slot-hint">select a date above to see available times</p>
              ) : slotsLoading ? (
                <p className="slot-hint">loading available times…</p>
              ) : allBooked ? (
                <p className="slot-full">fully booked for this day</p>
              ) : (
                <div className="slot-grid">
                  {[0,1,2,3].map(hour => {
                    const hourSlots = TIME_SLOTS.slice(hour * 12, (hour+1) * 12);
                    const label = hour === 0 ? '12 pm' : `${hour} pm`;
                    return (
                      <div key={hour} className="slot-col">
                        <div className="slot-hour">{label}</div>
                        {hourSlots.map(s => {
                          const isBooked   = bookedSlots.has(s.key);
                          const isSelected = details.time === s.label;
                          const h = parseInt(s.key.slice(0,2));
                          const display = `${h > 12 ? h-12 : h}:${s.key.slice(2)}`;
                          return (
                            <button
                              key={s.key}
                              className={`slot-btn${isBooked?' booked':''}${isSelected?' on':''}`}
                              onClick={() => { if (!isBooked) { set('time', s.label); onClearSlotConflict(); } }}
                            >{display}</button>
                          );
                        })}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            {/* Customer details */}
            <div className="co-section">
              <div className="co-section-title">your details</div>
              <div className="form-row">
                <div className="form-group">
                  <label className="form-label">first name</label>
                  <input className={`form-input${errors.firstName?' err':''}`} value={details.firstName||''} onChange={e=>set('firstName',e.target.value)} placeholder="kai" />
                  {errors.firstName && <span className="form-err">{errors.firstName}</span>}
                </div>
                <div className="form-group">
                  <label className="form-label">last name</label>
                  <input className={`form-input${errors.lastName?' err':''}`} value={details.lastName||''} onChange={e=>set('lastName',e.target.value)} placeholder="nakamura" />
                  {errors.lastName && <span className="form-err">{errors.lastName}</span>}
                </div>
              </div>
              <div className="form-group">
                <label className="form-label">phone</label>
                <input className={`form-input${errors.phone?' err':''}`} value={details.phone||''} onChange={e=>set('phone',fmtPhone(e.target.value))} placeholder="(831) 555-0100" inputMode="tel" />
                {errors.phone && <span className="form-err">{errors.phone}</span>}
                <span className="form-hint">confirmation and pickup details will be texted to this number</span>
              </div>
              <div className="form-group">
                <label className="form-label">email</label>
                <input className={`form-input${errors.email?' err':''}`} type="email" value={details.email||''} onChange={e=>set('email',e.target.value)} placeholder="you@email.com" />
                {errors.email && <span className="form-err">{errors.email}</span>}
              </div>
              <div className="form-group">
                <label className="form-label">special instructions <span style={{opacity:0.45}}>(optional)</span></label>
                <textarea className="form-textarea" value={details.notes||''} onChange={e=>set('notes',e.target.value)} placeholder="allergies, preferences, or notes" />
              </div>
              <div className="form-group">
                <label className="form-label">voucher # <span style={{opacity:0.45}}>(optional)</span></label>
                <input className="form-input" value={details.voucher||''} onChange={e=>set('voucher',e.target.value)} placeholder="e.g. V-0042" />
                <span className="form-hint">bring your physical voucher at pickup — drop it in the jar</span>
              </div>
            </div>

            {/* Promo + UCSC */}
            <div className="co-section">
              <div className="co-section-title">discounts</div>
              <div className="form-group">
                <label className="form-label">promo code <span style={{opacity:0.45}}>(optional)</span></label>
                <div className="promo-row">
                  <input
                    className="form-input"
                    value={promoInput}
                    onChange={e => { setPromoInput(e.target.value.toUpperCase()); setPromoStatus(null); setDetails(p => ({ ...p, promoCode:'', promoDiscount:0, promoFreeMusubi:false })); }}
                    onKeyDown={e => e.key === 'Enter' && applyPromo()}
                    placeholder="ENTER CODE" autoComplete="off"
                  />
                  <button className="promo-apply" onClick={applyPromo}>apply</button>
                </div>
                {promoStatus === 'ok' && details.promoFreeMusubi && <p className="promo-feedback ok">✓ free spam musubi added</p>}
                {promoStatus === 'ok' && !details.promoFreeMusubi && <p className="promo-feedback ok">✓ {Math.round((details.promoDiscount||0)*100)}% off applied</p>}
              </div>
              <div className="ucsc-block">
                <label className="ucsc-label">
                  <input type="checkbox" className="ucsc-check" checked={details.ucscStudent||false} onChange={e=>set('ucscStudent',e.target.checked)} />
                  <span className="ucsc-text">i'm a UC Santa Cruz student</span>
                </label>
                <p className="ucsc-note">UC Santa Cruz students get 10% off their order</p>
              </div>
            </div>

            {/* Order total */}
            <div className="co-section">
              <div className="co-section-title">order total</div>
              <div className="totals-block">
                {cartItems.map(ci => (
                  <div key={ci.cartId} className="total-row">
                    <span className="total-row-label">{ci.name} ×{ci.quantity}</span>
                    <span className="total-row-val">{fmtMoney(ci.unitPrice * ci.quantity)}</span>
                  </div>
                ))}
                {ucscDiscount > 0 && (
                  <div className="total-row discount">
                    <span className="total-row-label">ucsc student (10% off)</span>
                    <span className="total-row-val">−{fmtMoney(ucscDiscount)}</span>
                  </div>
                )}
                {promoDiscount > 0 && (
                  <div className="total-row discount">
                    <span className="total-row-label">{details.promoCode?.toUpperCase()} promo ({Math.round(details.promoDiscount*100)}% off)</span>
                    <span className="total-row-val">−{fmtMoney(promoDiscount)}</span>
                  </div>
                )}
                <div className="total-row final">
                  <span className="total-row-label">total</span>
                  <span className="total-row-val">{fmtMoney(finalTotal)}</span>
                </div>
              </div>
            </div>

            {/* Notices + SMS + Pay */}
            <div className="notices">
              <p className="notice"><em>*Consuming raw or undercooked meats, poultry, seafood, shellfish, or eggs may increase your risk of foodborne illness. By ordering you voluntarily relinquish any liability of any illnesses that may occur.*</em></p>
              <p className="notice">A text will be sent with your receipt &amp; pickup details following order placement.<br/><strong>Order will be canceled if not confirmed within 12 hours after confirmation text is sent.</strong></p>
            </div>

            <div className={`sms-block${smsErr?' err':''}`}>
              <label className="sms-label">
                <input type="checkbox" className="sms-check" checked={smsConsent} onChange={e => { setSmsConsent(e.target.checked); if(e.target.checked) setSmsErr(false); }} />
                <span className="sms-text">By submitting this form, I agree to receive order confirmation and status updates via text message from Inoa Food Group. Message &amp; data rates may apply. Reply STOP to unsubscribe.</span>
              </label>
              {smsErr && <p className="sms-err">You must agree to receive SMS updates to place an order.</p>}
            </div>

            {slotConflict && <p className="slot-conflict" style={{marginTop:'12px'}}>That pickup time was just taken — scroll up and choose a different slot.</p>}

            <div className="co-actions">
              <button className="co-back" onClick={onBack} disabled={submitting}>← back to menu</button>
              <button className="co-pay" onClick={handlePay} disabled={submitting}>
                {submitting ? 'redirecting…' : 'pay now →'}
              </button>
            </div>
            <p className="co-pay-note">secure payment via Square</p>
          </div>
        </div>
      );
    }

    // ── PreorderForm (root) ───────────────────────────────────────────────────
    function PreorderForm() {
      const PICKUP_DATES = getWindowDates();

      const [open,         setOpen]         = useState(isFormOpen);
      const [view,         setView]         = useState('menu');
      const [cartItems,    setCartItems]    = useState([]);
      const [modalItem,    setModalItem]    = useState(null);
      const [editLine,     setEditLine]     = useState(null);
      const [details,      setDetails]      = useState({ mode:'pickup' });
      const [slotConflict, setSlotConflict] = useState(false);
      const [submitting,   setSubmitting]   = useState(false);

      // Add simple (no-modal) item to cart
      function addSimple(item) {
        setCartItems(prev => {
          const existing = prev.find(ci => ci.itemId === item.id && !hasModal(item.id));
          if (existing) {
            return prev.map(ci => ci.cartId === existing.cartId ? { ...ci, quantity: ci.quantity + 1 } : ci);
          }
          return [...prev, {
            cartId:    uid(),
            itemId:    item.id,
            name:      item.name,
            basePrice: item.price,
            modifiers: {},
            quantity:  1,
            unitPrice: item.price,
          }];
        });
      }

      // Remove one unit of a simple item
      function removeSimple(item) {
        setCartItems(prev => {
          const existing = prev.find(ci => ci.itemId === item.id && !hasModal(item.id));
          if (!existing) return prev;
          if (existing.quantity <= 1) return prev.filter(ci => ci.cartId !== existing.cartId);
          return prev.map(ci => ci.cartId === existing.cartId ? { ...ci, quantity: ci.quantity - 1 } : ci);
        });
      }

      // Open modal for a new modal item
      function openModal(item) {
        setEditLine(null);
        setModalItem(item);
      }

      // Open modal for editing an existing cart line
      function editCartItem(line) {
        const item = ITEMS.find(it => it.id === line.itemId);
        if (!item) return;
        setEditLine(line);
        setModalItem(item);
      }

      // Add/update from modal
      function addFromModal(cartLine, isEdit) {
        setCartItems(prev => {
          if (isEdit) {
            return prev.map(ci => ci.cartId === cartLine.cartId ? cartLine : ci);
          }
          return [...prev, cartLine];
        });
      }

      // Remove a cart item by cartId
      function removeItem(cartId) {
        setCartItems(prev => prev.filter(ci => ci.cartId !== cartId));
      }

      // Change qty for a simple item in checkout review
      function changeQty(cartId, newQty) {
        if (newQty <= 0) { removeItem(cartId); return; }
        setCartItems(prev => prev.map(ci => ci.cartId === cartId ? { ...ci, quantity: newQty } : ci));
      }

      function goCheckout() { setView('checkout'); scrollTop(); }
      function goMenu()     { setView('menu');     scrollTop(); }

      async function handleSubmit() {
        setSubmitting(true);

        // Reserve slot in Firestore
        if (db) {
          const selectedSlot = TIME_SLOTS.find(s => s.label === details.time);
          if (selectedSlot) {
            const slotDocId = `${details.date}_${selectedSlot.key}`;
            const slotRef   = db.collection('slots').doc(slotDocId);
            try {
              await db.runTransaction(async t => {
                const doc = await t.get(slotRef);
                if (doc.exists) {
                  const data = doc.data();
                  const isExpired = data.status === 'reserved' &&
                    (Date.now() - (data.reservedAt?.toDate?.()?.getTime?.() || 0)) >= SLOT_HOLD_MS;
                  if (!isExpired) throw new Error('SLOT_TAKEN');
                }
                t.set(slotRef, {
                  date:          details.date,
                  slotKey:       selectedSlot.key,
                  slotLabel:     details.time,
                  status:        'reserved',
                  reservedAt:    firebase.firestore.FieldValue.serverTimestamp(),
                  customerName:  `${details.firstName} ${details.lastName}`,
                  squareOrderId: null,
                });
              });
            } catch(err) {
              if (err.message === 'SLOT_TAKEN') { setSlotConflict(true); setSubmitting(false); return; }
              console.error('[inoa] slot reservation error:', err);
              setSubmitting(false);
              return;
            }
          }
        }

        // Create Square payment link
        try {
          const res = await fetch('/api/create-payment-link', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              cartItems: cartItems.map(ci => ({
                itemId:    ci.itemId,
                name:      ci.name,
                modifiers: ci.modifiers,
                quantity:  ci.quantity,
              })),
              details: {
                date:            details.date,
                time:            details.time,
                firstName:       details.firstName,
                lastName:        details.lastName,
                phone:           details.phone,
                email:           details.email,
                notes:           details.notes || '',
                voucher:         details.voucher || '',
                ucscStudent:     !!details.ucscStudent,
                promoCode:       details.promoCode || '',
                promoDiscount:   details.promoDiscount || 0,
                promoFreeMusubi: !!details.promoFreeMusubi,
              },
            }),
          });
          const data = await res.json();
          if (!res.ok || !data.url) throw new Error(data.error || 'no payment url');
          window.location.href = data.url;
        } catch (err) {
          console.error('[inoa] payment link error:', err);
          setSubmitting(false);
        }
      }

      if (!open) {
        return <ClosedView onOpen={() => setOpen(true)} />;
      }

      return (
        <>
          {view === 'menu' && (
            <MenuView
              cartItems={cartItems}
              onAddSimple={addSimple}
              onRemoveSimple={removeSimple}
              onModalOpen={openModal}
            />
          )}

          {view === 'checkout' && (
            <CheckoutView
              cartItems={cartItems}
              onEditItem={editCartItem}
              onRemoveItem={removeItem}
              onQtyChange={changeQty}
              details={details}
              setDetails={setDetails}
              onBack={goMenu}
              onSubmit={handleSubmit}
              slotConflict={slotConflict}
              onClearSlotConflict={() => setSlotConflict(false)}
              submitting={submitting}
              pickupDates={PICKUP_DATES}
            />
          )}

          {modalItem && (
            <ItemModal
              item={modalItem}
              editLine={editLine}
              onAdd={addFromModal}
              onClose={() => { setModalItem(null); setEditLine(null); }}
            />
          )}

          {view === 'menu' && (
            <CartBar
              cartItems={cartItems}
              onCheckout={goCheckout}
            />
          )}
        </>
      );
    }

    // Mount
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PreorderForm />);
  </script>
</body>
</html>
